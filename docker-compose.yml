version: '3'
services:
  backend:
    build: .
    container_name: trip-backend
    ports:
      - "5050:5050"
    volumes:
      # [중요] 로컬의 data 폴더와 컨테이너 내부 data 폴더를 연결(Sync)
      # 컨테이너가 꺼져도 엑셀 파일 데이터가 날아가지 않게
      - ./data:/app/data
      - ./app.py:/app/app.py
      - ./extensions.py:/app/extensions.py
      - ./models.py:/app/models.py
      - ./routes:/app/routes
      - ./site_settings.py:/app/site_settings.py
      - ./uploads:/app/uploads
    restart: always
    # [추가됨] 로컬에 있는 .env 파일을 컨테이너가 읽을 수 있게 등록 함
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1